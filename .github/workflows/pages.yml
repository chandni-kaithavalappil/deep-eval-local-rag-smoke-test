name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          mkdir -p _site/results
          cp index.html _site/index.html
          cp results/deepeval_dashboard.html _site/results/deepeval_dashboard.html
          cp results/demo_scores_summary.md _site/results/demo_scores_summary.md
          cp results/demo_scores_summary.json _site/results/demo_scores_summary.json
          cp results/demo_answer_relevancy_scores.json _site/results/demo_answer_relevancy_scores.json
          cp results/demo_contextual_relevancy_scores.json _site/results/demo_contextual_relevancy_scores.json
          cp results/demo_faithfulness_scores.json _site/results/demo_faithfulness_scores.json
          cp results/demo_refusal_pattern_scores.json _site/results/demo_refusal_pattern_scores.json
          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
